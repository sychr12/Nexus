# Spring Application Name
spring.application.name=backend

# Server Configuration
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sicpr}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:120506}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.sicpr.backend=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Jackson
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.default-property-inclusion=non_null

# Security
jwt.secret=${JWT_SECRET:uma_chave_secreta_bem_grande_para_desenvolvimento_local_sicpr_2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.crypto.key=${DATA_ENCRYPTION_KEY:12345678901234567890123456789012}