# Spring Application Name
spring.application.name=backend
spring.profiles.default=dev

# Server Configuration
server.port=8080

# JPA Configuration
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Database migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.sicpr.backend=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Jackson
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.default-property-inclusion=non_null

# Observability
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Upload limits
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_REQUEST_SIZE:80MB}
app.upload.message-attachment-max-size=${MESSAGE_ATTACHMENT_MAX_SIZE:10MB}
app.upload.carteira-photo-max-size=${CARTEIRA_PHOTO_MAX_SIZE:2MB}
app.upload.carteira-batch-pdf-max-size=${CARTEIRA_BATCH_PDF_MAX_SIZE:10MB}
app.upload.carteira-batch-zip-max-size=${CARTEIRA_BATCH_ZIP_MAX_SIZE:50MB}
app.upload.carteira-batch-max-files=${CARTEIRA_BATCH_MAX_FILES:50}
app.upload.carteira-batch-max-zip-entries=${CARTEIRA_BATCH_MAX_ZIP_ENTRIES:100}

# Security defaults
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
app.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:Lax}
app.crypto.search-key=${DATA_SEARCH_HASH_KEY:${app.crypto.key}}
