# Local development defaults. Use SPRING_PROFILES_ACTIVE=prod in production.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sicpr}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

jwt.secret=${JWT_SECRET:local_dev_only_jwt_secret_change_before_shared_use}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.crypto.key=${DATA_ENCRYPTION_KEY:local_dev_only_crypto_key_change_before_shared_use}
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:*}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
app.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:Lax}

# Populates the fluxo module only when both fluxo tables are empty.
sicpr.fluxo.seed.enabled=${FLUXO_DEV_SEED_ENABLED:true}
sicpr.security.data-migration.enabled=${SENSITIVE_DATA_MIGRATION_ENABLED:true}
sicpr.security.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
sicpr.security.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
sicpr.security.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
sicpr.security.bootstrap-admin.name=${BOOTSTRAP_ADMIN_NAME:Administrador SICPR}
sicpr.security.bootstrap-admin.reset-password=${BOOTSTRAP_ADMIN_RESET_PASSWORD:false}
sicpr.security.bootstrap-users.enabled=${BOOTSTRAP_USERS_ENABLED:false}
sicpr.security.bootstrap-users.entries=${BOOTSTRAP_USERS_ENTRIES:}
