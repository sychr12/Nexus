spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.crypto.key=${DATA_ENCRYPTION_KEY}
app.cors.allowed-origins=${ALLOWED_ORIGINS}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
app.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:Lax}

springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}

sicpr.fluxo.seed.enabled=false
sicpr.security.data-migration.enabled=${SENSITIVE_DATA_MIGRATION_ENABLED:true}
sicpr.security.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
sicpr.security.bootstrap-admin.reset-password=${BOOTSTRAP_ADMIN_RESET_PASSWORD:false}
sicpr.security.bootstrap-users.enabled=${BOOTSTRAP_USERS_ENABLED:false}
sicpr.security.bootstrap-users.entries=${BOOTSTRAP_USERS_ENTRIES:}
