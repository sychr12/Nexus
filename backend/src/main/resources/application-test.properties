spring.datasource.url=jdbc:h2:mem:sicpr;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=false

jwt.secret=test_sicpr_jwt_secret_with_more_than_32_chars
jwt.expiration-ms=86400000
app.crypto.key=test_sicpr_crypto_key_with_more_than_32

sicpr.fluxo.seed.enabled=false
sicpr.security.data-migration.enabled=false
sicpr.security.bootstrap-admin.enabled=false
sicpr.security.bootstrap-admin.reset-password=false
sicpr.security.bootstrap-users.enabled=false

logging.level.org.springframework=WARN
logging.level.org.springframework.test.context=WARN
logging.level.org.hibernate=WARN
logging.level.org.flywaydb=INFO
logging.level.com.sicpr.backend=INFO
